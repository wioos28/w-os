workflows:
  # ====================================================
  # Workflow 1: Build Simulator (chỉ tạo .app, không có .ipa)
  # ====================================================
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "15.2"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Simulator
        script: |
          set -e
          xcodebuild clean build \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Products/Debug-iphonesimulator/*.app

  # ====================================================
  # Workflow 2: Build Device + Export IPA
  # Yêu cầu: Cấu hình signing trong Codemagic UI
  #   Settings → Code signing → Upload certificate + profile
  # ====================================================
  ios-device-release:
    name: iOS Device Release (IPA)
    max_build_duration: 120
    environment:
      vars:
        XCODE_VERSION: "15.2"
      groups:
        - ios_signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Clean
        script: |
          set -e
          rm -rf build/ derived_data/
          mkdir -p build/ipa
      - name: Archive
        script: |
          set -e
          echo "=== Step 1: Archive ==="
          xcodebuild archive \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath derived_data \
            -archivePath build/WOS.xcarchive \
            | xcpretty
          echo "=== Archive done ==="
          ls -la build/WOS.xcarchive
      - name: Export IPA
        script: |
          set -e
          echo "=== Step 2: Export IPA ==="
          xcodebuild -exportArchive \
            -archivePath build/WOS.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            | xcpretty
          echo "=== Export done ==="
          echo "Files in build/ipa:"
          find build/ipa -type f -name "*.ipa" -o -name "*.plist" | head -20
      - name: Verify IPA exists
        script: |
          set -e
          IPA_COUNT=$(find build/ipa -name "*.ipa" 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $IPA_COUNT IPA file(s)"
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "WARNING: No IPA generated. Listing all files:"
            find build/ -type f | head -50
          else
            echo "IPA files:"
            find build/ipa -name "*.ipa" -exec ls -lh {} \;
          fi
    artifacts:
      - build/ipa/**/*.ipa
      - build/ipa/**/*.plist
      - build/WOS.xcarchive
