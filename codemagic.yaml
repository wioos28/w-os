workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "15.2"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Simulator
        script: |
          xcodebuild build \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Products/Debug-iphonesimulator/*.app

  ios-device-release:
    name: iOS Device Release
    max_build_duration: 90
    environment:
      vars:
        XCODE_VERSION: "15.2"
      groups:
        - ios_signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up signing
        script: |
          echo "Checking for signing certificate..."
      - name: Build and archive
        script: |
          xcodebuild archive \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/WOS.xcarchive \
            CODE_SIGNING_ALLOWED=YES
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/WOS.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/*.ipa
