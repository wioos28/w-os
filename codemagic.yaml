workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "15.2"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Simulator
        script: |
          set -e
          xcodebuild clean build \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Products/Debug-iphonesimulator/*.app

  ios-device-release:
    name: iOS Device Release
    max_build_duration: 120
    environment:
      vars:
        XCODE_VERSION: "15.2"
      groups:
        - ios_signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Clean build folder
        script: |
          set -e
          rm -rf build/
          mkdir -p build/ipa
      - name: Archive for device
        script: |
          set -e
          echo "=== Archiving WOS for iOS Device ==="
          xcodebuild archive \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/WOS.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "=== Archive completed ==="
          ls -la build/WOS.xcarchive
      - name: Export IPA
        script: |
          set -e
          echo "=== Exporting IPA ==="
          xcodebuild -exportArchive \
            -archivePath build/WOS.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
          echo "=== Export completed ==="
          ls -la build/ipa/
    artifacts:
      - build/ipa/*.ipa
