workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "15.2"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Simulator
        script: |
          xcodebuild build \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Products/Debug-iphonesimulator/*.app

  ios-device-release:
    name: iOS Device Release
    max_build_duration: 90
    environment:
      vars:
        XCODE_VERSION: "15.2"
      groups:
        - ios_signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Device
        script: |
          xcodebuild build \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Products/Release-iphoneos/*.ipa
    publishing:
      app_store_connect:
        auth: integration
