workflows:
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_VERSION: "15.2"
      groups:
        - ios_signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Clean build folder
        script: |
          set -e
          rm -rf build/ derived_data/
          mkdir -p build/ipa

      - name: Archive for iOS Device
        script: |
          set -e
          echo "=== Step 1: Archive ==="
          xcodebuild archive \
            -project WOS.xcodeproj \
            -scheme WOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath derived_data \
            -archivePath build/WOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          echo "=== Archive done ==="
          ls -la build/WOS.xcarchive

      - name: Export Unsigned IPA (Bypass Xcode Export)
        script: |
          set -e
          echo "=== Step 2: Manually Package IPA ==="
          mkdir -p build/ipa/Payload
          cp -r build/WOS.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -qr WOS_unsigned.ipa Payload
          rm -rf Payload
          echo "=== Export done ==="
          ls -la

      - name: Verify IPA
        script: |
          set -e
          IPA_COUNT=$(find build/ipa -name "*.ipa" 2>/dev/null | wc -l | tr -d ' ')
          echo "========================================="
          echo "  IPA Verification: Found $IPA_COUNT IPA(s)"
          echo "========================================="
          if [ "$IPA_COUNT" -gt 0 ]; then
            echo "SUCCESS - IPA files:"
            find build/ipa -name "*.ipa" -exec ls -lh {} \;
          else
            echo "FAILED - No IPA generated."
            find build/ -type f 2>/dev/null | head -30
          fi

    artifacts:
      - build/ipa/*.ipa
      - build/ipa/**/*.ipa
      - build/*.xcarchive
      - build/WOS.xcarchive
